    grid_connection_kv: 220
    pv_blocks: 4          # PV1..PV4, 25 MWac each
    inverter_stations_per_block: 7
    module_wp: 620
    tracker: single-axis horizontal tracker
    expected_p50_gwh_year: 236
  contract:
