      Flat to gently undulating desert plateau ~45 km north-east of Navoi city, elevation 310-335 m,
      sandy loam over gypsum-cemented layers, sparse vegetation, no settlements within 6 km.
      Access via 12 km unpaved track from the A-380 highway. Nearest 220 kV substation 9 km south.
